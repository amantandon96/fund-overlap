[project]
name = "fund-overlap-pipeline"
version = "0.1.0"
description = "Fetches monthly mutual fund portfolio disclosures and builds the static holdings database"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "httpx[http2]>=0.27",
]

[project.scripts]
fund-overlap = "fund_overlap.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fund_overlap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
