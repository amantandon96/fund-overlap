name: Deploy site

# Publishes web/ (plus the JSON in data/) to GitHub Pages. Merging a data
# refresh PR touches data/, so the site updates itself each month.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      # Copies ../data into public/data, type-checks, and writes web/dist.
      # Theming (the System/Light/Dark switcher) is off unless the repo
      # variable ENABLE_THEMING is set to "true" (Settings -> Variables).
      - run: npm run build
        env:
          VITE_ENABLE_THEMING: ${{ vars.ENABLE_THEMING || 'false' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
